[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognets-swarm-arena"
version = "1.0.0"
description = "Local arena for the CoGNETs VelesHack 2026 challenge: dynamic node registration and resource allocation at the edge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The CoGNETs Consortium" }]
keywords = ["edge-computing", "game-theory", "kelly-mechanism", "hackathon", "cognets"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "httpx>=0.27",
]


[project.scripts]
cognets-arena = "arena.__main__:main"

[tool.setuptools]
packages = ["arena"]
include-package-data = true

[tool.setuptools.package-data]
arena = ["scenarios/*.yaml", "static/*.html"]

